name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

# Least privilege by default; only the publish job gets an OIDC token.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject.toml and docs/conf.py
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          docs=$(python -c "import re; print(re.search(r'^release = \"(.+)\"', open('docs/conf.py').read(), re.M).group(1))")
          echo "tag=$tag pyproject=$pkg docs=$docs"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$docs" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml ($pkg) / docs/conf.py ($docs)"
            exit 1
          fi

      - name: Install build tools
        run: pip install -r .github/requirements/release.txt

      - name: Build distributions
        run: |
          python -m build
          twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
