name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check tag matches pyproject.toml and docs/conf.py
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          docs=$(python -c "import re; print(re.search(r'^release = \"(.+)\"', open('docs/conf.py').read(), re.M).group(1))")
          echo "tag=$tag pyproject=$pkg docs=$docs"
          if [ "$tag" != "$pkg" ] || [ "$tag" != "$docs" ]; then
            echo "::error::Tag v$tag does not match pyproject.toml ($pkg) / docs/conf.py ($docs)"
            exit 1
          fi

      - name: Install build tools
        run: pip install build twine

      - name: Build distributions
        run: |
          python -m build
          twine check --strict dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for trusted publishing

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
